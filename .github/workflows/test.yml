name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ["5.3", "5.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Run tests
        run: mise run test

      - name: Test self build
        run: mise run test-self-build
